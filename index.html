:root {
  /* Bounce design-system tokens */
  --red: #D42B30;
  --green: #178040;
  --green-surface: #D6F0DE;
  --text-heading: #424242;
  --text-body: #5E5E5E;
  --text-muted: #8A8A8A;
  --page: #FFFFFF;
  --card: #FFFFFF;
  --hairline: #EDEBE8;
  --grid: #EDEBE8;
  --spark: #C9C6C1;
  /* chart series: validated together (all pairs pass, light mode) */
  --s-deploy: #D42B30;
  --s-submit: #2a78d6;
  --s-new: #eda100;
  --s-existing: #1baf7a;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); }
body {
  font-family: "Hanken Grotesk", system-ui, sans-serif;
  color: var(--text-body);
  line-height: 1.2;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 32px 28px 56px; }

/* header */
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 44px; height: 44px; border-radius: 13px; background: var(--red); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 24px; letter-spacing: -1px; }
h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-heading); }
.sub { margin-top: 4px; font-size: 15px; color: var(--text-muted); min-height: 18px; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; background: #F6F5F3; font-size: 14px; font-weight: 600; color: var(--text-heading); }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
.pill.live .dot { background: var(--green); }

/* hero band */
.hero {
  border-radius: 22px; padding: 26px 28px; margin-bottom: 18px;
  background: linear-gradient(135deg, #FFF4F4 0%, #FFE6E6 100%);
  border: 1px solid #F6CFD0;
  display: grid; grid-template-columns: 1.15fr 1fr 1fr 1fr; min-height: 200px;
}
.hero .cell { padding: 0 22px; border-left: 1px solid #F3D3D4; }
.hero .cell:first-child { padding-left: 0; border-left: 0; }
.label { font-size: 15px; font-weight: 600; color: var(--text-heading); }
.label small { display: block; margin-top: 2px; font-weight: 500; color: var(--text-muted); font-size: 13px; }
.hero-value { font-size: 56px; font-weight: 800; letter-spacing: -2px; color: var(--text-heading); margin: 10px 0 8px; }
.value { font-size: 36px; font-weight: 800; letter-spacing: -1px; color: var(--text-heading); margin: 10px 0 8px; }
.delta { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
.delta.good { color: var(--green); background: var(--green-surface); }
.delta.bad  { color: var(--red); background: #FFE0E1; }
.delta.flat { color: var(--text-body); background: #EFEDEA; }
.delta svg { width: 10px; height: 10px; }
.vs { font-size: 13px; color: var(--text-muted); margin-left: 6px; }
.note { font-size: 13px; color: var(--text-muted); margin-top: 12px; }
.spark { display: block; margin-top: 14px; width: 100%; height: 34px; }

/* sections */
section { margin-top: 34px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.4px; color: var(--red); }
.sec-note { font-size: 14px; color: var(--text-muted); }
.card { background: var(--card); border: 1px solid var(--hairline); border-radius: 22px; padding: 22px; }

/* colour-blocked sibling tiles */
.tiles4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.tile { border-radius: 16px; padding: 20px 22px; border: 1px solid; min-height: 150px; }
.tile .name { font-size: 16px; font-weight: 700; color: var(--text-heading); }
.tile .value { font-size: 40px; }
.tint-red   { background: linear-gradient(160deg, #FFF6F6, #FFE9EA); border-color: #F6CFD0; }
.tint-gold  { background: linear-gradient(160deg, #FFFBF0, #FFF1D2); border-color: #F2DFAF; }
.tint-green { background: linear-gradient(160deg, #F4FBF6, #DFF3E6); border-color: #BFE3CB; }
.tint-blue  { background: linear-gradient(160deg, #F5F8FE, #E3ECFB); border-color: #C7D7F2; }

/* charts */
.chart-grid { display: grid; grid-template-columns: 300px 1fr; gap: 14px; }
.mini { display: grid; gap: 14px; }
.mini .card { padding: 20px 22px; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; color: var(--text-body); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.key-line { display: inline-block; width: 16px; height: 2px; border-radius: 2px; }
.key-rect { display: inline-block; width: 11px; height: 11px; border-radius: 3px; }
.bg-deploy { background: var(--s-deploy); }
.bg-submit { background: var(--s-submit); }
.bg-new { background: var(--s-new); }
.bg-existing { background: var(--s-existing); }
.chart { position: relative; min-height: 262px; }
.chart svg { display: block; width: 100%; overflow: visible; }
.axis text { font-size: 12px; fill: var(--text-muted); font-variant-numeric: tabular-nums; }
.tip {
  position: absolute; pointer-events: none; background: #fff; border: 1px solid var(--hairline);
  border-radius: 12px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.08);
  font-size: 13px; min-width: 150px; opacity: 0; transition: opacity .08s; z-index: 5;
}
.tip .d { color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
.tip .row { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.tip .row b { color: var(--text-heading); font-size: 15px; min-width: 34px; }
.tip .k { width: 12px; height: 2px; border-radius: 2px; }
.tip .foot { margin-top: 6px; color: var(--text-muted); }
details { margin-top: 12px; }
summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-muted); }
table { border-collapse: collapse; margin-top: 10px; font-size: 13px; font-variant-numeric: tabular-nums; width: 100%; }
th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--hairline); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text-muted); font-weight: 600; }

/* states */
.loading { opacity: .45; }
.problem { grid-column: 1 / -1; align-self: start; border-radius: 16px; padding: 18px 20px; background: #FFF6F6; border: 1px solid #F6CFD0; color: var(--text-heading); font-size: 15px; }
.problem a { color: var(--red); font-weight: 700; }

footer { margin-top: 36px; font-size: 13px; color: var(--text-muted); line-height: 1.5; }
footer b { color: var(--text-body); }

/* demo pages: make fake data impossible to mistake for real */
.demo-tag { display: inline-block; vertical-align: middle; margin-left: 8px; padding: 3px 9px; border-radius: 999px; background: #FFF1D2; color: #8a5a00; font-size: 13px; font-weight: 700; letter-spacing: 0; }
.pill.demo { background: #FFF1D2; color: #8a5a00; }
.pill.demo .dot { background: var(--s-new); }

/* ---- compact tiles for dense overview grids ---- */
.card.compact, .tile.compact { padding: 16px 18px; border-radius: 16px; min-height: 0; }
.compact .label, .compact .name { font-size: 14px; }
.compact .value { font-size: 28px; margin: 8px 0 6px; }
.compact .delta { font-size: 12px; padding: 3px 8px; }
.compact .vs { font-size: 12px; }
.compact .spark { margin-top: 10px; height: 26px; }
.badge { display: inline-block; margin-left: 6px; padding: 2px 7px; border-radius: 999px; background: #EFEDEA; color: var(--text-muted); font-size: 11px; font-weight: 700; vertical-align: 1px; }
.deltaline { display: flex; align-items: center; flex-wrap: wrap; gap: 0; }

/* ---- layout grids ---- */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.tiles5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.tiles6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.card h3 { margin: 0 0 4px; font-size: 16px; font-weight: 700; color: var(--text-heading); }
.card .card-note { font-size: 13px; color: var(--text-muted); margin-bottom: 12px; }
.span2 { grid-column: span 2; }

/* ---- bar list (breakdowns, funnels, age bands) ---- */
.barlist { display: grid; gap: 10px; margin-top: 6px; }
.bl-row { display: grid; grid-template-columns: 175px 1fr 90px; align-items: center; gap: 12px; font-size: 14px; }
.bl-name { color: var(--text-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bl-track { height: 12px; }
.bl-bar { height: 12px; border-radius: 0 4px 4px 0; }
.bl-val { text-align: right; font-weight: 700; color: var(--text-heading); font-variant-numeric: tabular-nums; }
.bl-note { display: block; font-size: 11px; font-weight: 500; color: var(--text-muted); }

/* ---- comparison table (city × metric) ---- */
table.score { margin-top: 4px; font-size: 14px; }
table.score th { font-size: 12px; padding: 8px 10px; }
table.score td { padding: 10px; vertical-align: top; }
table.score td:first-child { font-weight: 700; color: var(--text-heading); }
table.score .sv { font-weight: 700; color: var(--text-heading); }
table.score tr.hl td { background: #FFF6F6; }
.delta.small { font-size: 11px; padding: 2px 6px; margin-top: 4px; gap: 3px; }
.delta.small svg { width: 8px; height: 8px; }

/* ---- page navigation and filters ---- */
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: #F6F5F3; flex-wrap: wrap; }
.tabs button { font: inherit; font-size: 14px; font-weight: 600; color: var(--text-body); background: transparent; border: 0; border-radius: 10px; padding: 8px 14px; cursor: pointer; }
.tabs button[aria-selected="true"] { background: #fff; color: var(--red); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.filters { display: flex; gap: 10px; align-items: center; }
.filters label { font-size: 13px; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
.filters select { font: inherit; font-size: 14px; font-weight: 600; color: var(--text-heading); background: #fff; border: 1px solid var(--hairline); border-radius: 10px; padding: 7px 10px; }
.area-head { display: flex; align-items: baseline; gap: 12px; margin: 30px 0 12px; }
.area-head h2 { font-size: 20px; }
.area-head .sec-note { margin-left: auto; }
.legend .key-line, .legend .key-rect { flex: none; }
#page > .grid2, #page > .grid3, #page > .card { margin-bottom: 14px; }

/* ---- donut with legend ---- */
.donut { display: flex; align-items: center; gap: 22px; margin-top: 6px; }
.donut svg { flex: none; }
.donut-legend { flex: 1; display: grid; gap: 8px; min-width: 0; }
.dl-row { display: grid; grid-template-columns: 12px 1fr auto 52px; align-items: center; gap: 8px; font-size: 13px; }
.dl-name { color: var(--text-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dl-val { font-weight: 700; color: var(--text-heading); font-variant-numeric: tabular-nums; text-align: right; }
.dl-pct { color: var(--text-muted); font-variant-numeric: tabular-nums; text-align: right; }

/* ---- small multiples and paired charts ---- */
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.mult-title { font-size: 13px; font-weight: 700; color: var(--text-heading); margin: 6px 0 2px; }
.pair-gap { height: 6px; }
#page > .grid4 { margin-bottom: 14px; }
.chart:has(svg) { min-height: 0; } /* placeholder height only while loading */

/* ---- tight overview grid: everything at a glance ---- */
.ov { display: grid; grid-template-columns: repeat(12, 1fr); gap: 8px; margin-top: 4px; }
.ov > .card { padding: 10px 12px; border-radius: 12px; min-width: 0; }
.ov .s2 { grid-column: span 2; } .ov .s3 { grid-column: span 3; } .ov .s4 { grid-column: span 4; } .ov .s6 { grid-column: span 6; }
.ov h3 { font-size: 12.5px; margin: 0 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov h3 span { font-weight: 500; color: var(--text-muted); }
.ov .label, .ov .name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov .value { font-size: 22px; letter-spacing: -0.5px; margin: 4px 0 4px; }
.ov .delta { font-size: 11px; padding: 2px 6px; gap: 3px; }
.ov .delta svg { width: 8px; height: 8px; }
.ov .vs { font-size: 11px; margin-left: 4px; }
.ov .spark { margin-top: 6px; height: 18px; }
.ov .legend { font-size: 11.5px; gap: 10px; margin-bottom: 2px; }
.ov .legend .key-line { width: 10px; } .ov .legend .key-rect { width: 8px; height: 8px; }
.ov .axis text { font-size: 10px; }
.ov .chart { min-height: 0; }
.ov .donut { gap: 10px; margin-top: 4px; }
.ov .dl-row { grid-template-columns: 8px 1fr 40px; gap: 6px; font-size: 11.5px; }
.ov .dl-row .key-rect { width: 8px; height: 8px; }
.ov .donut-legend { gap: 5px; }
.ov .barlist { gap: 5px; margin-top: 2px; }
.ov .bl-row { grid-template-columns: 78px 1fr 40px; gap: 6px; font-size: 11.5px; }
.ov .bl-track, .ov .bl-bar { height: 8px; }
.ov .bl-note { display: none; }
.ov table.score { font-size: 11.5px; margin-top: 0; }
.ov table.score th { font-size: 10.5px; padding: 3px 4px; }
.ov table.score td { padding: 4px; }
.ov table.score .sv { font-weight: 600; }
.ov .delta.small { font-size: 10px; padding: 1px 4px; margin-top: 2px; }
.wrap.wide { max-width: 1600px; padding: 20px 24px 40px; }
.wide header { margin-bottom: 14px; } .wide .toolbar { margin-bottom: 12px; } .wide h1 { font-size: 24px; } .wide .logo { width: 38px; height: 38px; font-size: 21px; }
/* donut: tooltip and percent right next to the name */
.donut { position: relative; }
.ov .dl-row { grid-template-columns: 8px max-content max-content; justify-content: start; gap: 6px; }
.ov .dl-pct { text-align: left; font-weight: 600; color: var(--text-heading); }
/* city tables in the overview: change chip inline with the value, rows stay one line */
.ov table.score .sv { display: inline; }
.ov table.score .delta.small { margin: 0 0 0 5px; vertical-align: 1px; }
/* overview headline strip: nine cards in one row */
.ov.top { grid-template-columns: repeat(10, 1fr); margin-bottom: 8px; }
.ov.top .donut { margin-top: 2px; gap: 8px; }
.ov.top .dl-row { font-size: 11px; gap: 4px; }
.ov.top .donut-legend { gap: 2px; }
.ov > .card { overflow: hidden; }
.ov.top .dl-row { font-size: 10.5px; gap: 3px; }
.ov.top .dl-row .key-rect { width: 7px; height: 7px; }
/* totals in distribution tables */
table.score tr.tot td { font-weight: 700; color: var(--text-heading); background: #FAF9F7; border-bottom: 0; }
table.score tr.tot .sv { font-weight: 800; }
table.score td.totcol, table.score th.totcol { background: #FAF9F7; }
.ov table.score .muted { color: var(--text-muted); font-weight: 500; }
.ov .dl-row { grid-template-columns: 8px; grid-auto-flow: column; grid-auto-columns: max-content; }
/* overview chart tiles: five to a row, value on top, chart below */
.ov.five { grid-template-columns: repeat(5, 1fr); gap: 10px; }
.ov .ctile { padding: 12px 14px; }
.ov .ctile .value { font-size: 26px; margin: 4px 0 2px; }
.ov .ctile .label .period, .ov h3 .period { font-weight: 500; color: var(--text-muted); }
.ov .ctile .chart { margin-top: 8px; }
.ov .ctile .donut { margin-top: 10px; }
.ov.area { gap: 10px; }
.ov .s5 { grid-column: span 5; } .ov .s7 { grid-column: span 7; } .ov .s8 { grid-column: span 8; } .ov .s9 { grid-column: span 9; } .ov .s12 { grid-column: span 12; }
.ov.five .w2 { grid-column: span 2; }
.ov .ctile table.score { margin-top: 6px; }
.ov .ctile .barlist { margin-top: 10px; gap: 7px; }
.ov.six { grid-template-columns: repeat(6, 1fr); gap: 10px; }
.ov.six .w2 { grid-column: span 2; }
.ov.six .ctile .legend { margin-top: 6px; }

/* ================= clean shell and larger text (leads overview, .wide pages) ================= */
.wide { padding-top: 0; }
.wide .bar { display: flex; align-items: center; gap: 28px; padding: 14px 0; margin: 0 0 4px; border-bottom: 1px solid var(--hairline); position: sticky; top: 0; background: var(--page); z-index: 10; }
.wide .bar .brand { gap: 10px; }
.wide .bar h1 { font-size: 20px; letter-spacing: -0.3px; }
.wide .bar .logo { width: 32px; height: 32px; border-radius: 9px; font-size: 18px; }
.wide .bar .demo-tag { margin-left: 0; font-size: 12px; }
.wide .tabs { background: none; padding: 0; gap: 22px; border-radius: 0; flex: 1; }
.wide .tabs button { padding: 6px 0; border-radius: 0; font-size: 15px; font-weight: 600; color: var(--text-muted); border-bottom: 2px solid transparent; }
.wide .tabs button:hover { color: var(--text-heading); }
.wide .tabs button[aria-selected="true"] { background: none; box-shadow: none; color: var(--red); border-bottom-color: var(--red); }
.wide .filters select { font-size: 14px; padding: 7px 10px; }
.wide .meta { font-size: 13px; color: var(--text-muted); margin: 10px 0 12px; }
.wide .ov > .card { padding: 14px 16px; border-radius: 14px; }
.wide .ov h3, .wide .ov .label, .wide .ov .name { font-size: 14.5px; }
.wide .ov .label .period, .wide .ov h3 span { font-size: 13px; }
.wide .ov .ctile .value { font-size: 30px; margin: 6px 0 4px; }
.wide .ov .delta { font-size: 12.5px; padding: 3px 8px; }
.wide .ov .vs { font-size: 12.5px; }
.wide .ov .legend { font-size: 13px; }
.wide .ov .axis text { font-size: 11.5px; }
.wide .ov table.score { font-size: 13.5px; }
.wide .ov table.score th { font-size: 12px; padding: 5px 6px; }
.wide .ov table.score td { padding: 6px; }
.wide .ov .dl-row { font-size: 13px; }
.wide .ov .bl-row { font-size: 13.5px; grid-template-columns: 90px 1fr 56px; }
.wide .ov .bl-track, .wide .ov .bl-bar { height: 10px; }
.wide .badge { font-size: 11px; }
.wide .tip { font-size: 13.5px; }
.wide .ov .value { font-size: 28px; margin: 6px 0 4px; }

/* in-page jump links for long tabs (Revenue) */
.jump { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 6px; position: sticky; top: 0; z-index: 5; background: var(--page); padding: 8px 0; }
.jump button { font: inherit; font-size: 12.5px; font-weight: 600; color: var(--text-body); background: #F6F5F3; border: 0; border-radius: 999px; padding: 6px 11px; cursor: pointer; }
.jump button:hover { background: #EFEDEA; color: var(--text-heading); }
.area-head { scroll-margin-top: 56px; }
.ov .card .card-note { font-size: 12px; margin: 0 0 6px; }
/* tables of text (e.g. definitions): left-align every column */
.ov .card.text-table table.score th, .ov .card.text-table table.score td { text-align: left; }

/* ===================== app shell: grouped left sidebar + responsive grid (body.app) =====================
   >= 1400px  sidebar expanded (232px) beside the content
   < 1400px   sidebar collapsed to a 64px icon rail; hovering slides it open OVER the content
              (content does not move); picking a page closes it again
   < 700px    sidebar hidden; the menu button opens it as a drawer
   Grid columns step down at 1400 / 1100 / 700 so cards stay readable; charts redraw to fit. */
body.app { --side-open: 232px; --side-rail: 64px; }
.app .side { position: fixed; inset: 0 auto 0 0; width: var(--side-open); background: #FBFAF8; border-right: 1px solid var(--hairline);
  display: flex; flex-direction: column; z-index: 30; overflow: hidden auto; transition: width .16s ease, box-shadow .16s ease, transform .2s ease; }
.app .content { margin-left: var(--side-open); }
.app .side-brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 14px; white-space: nowrap; }
.app .side-brand .logo { width: 32px; height: 32px; border-radius: 9px; font-size: 18px; flex: none; }
.app .side-title { font-size: 18px; font-weight: 800; color: var(--text-heading); letter-spacing: -0.3px; }
.app .side-brand .demo-tag { margin-left: 0; font-size: 11px; padding: 2px 7px; }
.app #nav { display: flex; flex-direction: column; padding: 4px 10px 20px; gap: 2px; }
.app .side-group { font-size: 11.5px; font-weight: 700; color: var(--text-muted); padding: 14px 10px 4px; white-space: nowrap; height: 30px; box-sizing: border-box; }
.app .side-item { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 10px; color: var(--text-body); text-decoration: none; font-size: 14.5px; font-weight: 600; white-space: nowrap; }
.app .side-item:hover { background: #F1EFEC; color: var(--text-heading); }
.app .side-item[aria-current="page"] { background: #FFECED; color: var(--red); }
.app .side-icon { flex: none; }
.app .side-label { transition: opacity .12s ease; }
.app .side-backdrop { display: none; }

/* page header: title, data line, filters */
.app .wrap.wide { padding-top: 0; }
.app .page-head { display: flex; align-items: center; gap: 16px; padding: 16px 0 14px; margin-bottom: 6px; border-bottom: 1px solid var(--hairline);
  position: sticky; top: 0; background: var(--page); z-index: 20; }
.app .page-titles { flex: 1; min-width: 0; }
.app .page-head h1 { font-size: 22px; letter-spacing: -0.3px; margin: 0; }
.app .page-head .meta { margin: 2px 0 0; font-size: 13px; color: var(--text-muted); }
.app .page-head .filters { display: flex; gap: 8px; }
.app .page-head select { font-size: 14px; padding: 7px 10px; }
.app .menu-btn { display: none; font: inherit; font-size: 20px; line-height: 1; background: #F6F5F3; border: 0; border-radius: 10px; padding: 8px 11px; cursor: pointer; color: var(--text-heading); }
.app .ov > .card { overflow-x: auto; overflow-y: hidden; }

/* < 1400px: icon rail; hover or keyboard focus slides it open over the content */
@media (max-width: 1399px) {
  .app .content { margin-left: var(--side-rail); }
  .app .side { width: var(--side-rail); }
  .app .side .side-label, .app .side .side-group { opacity: 0; }
  .app .side-group { padding-top: 6px; height: 14px; overflow: hidden; color: transparent; border-top: 1px solid var(--hairline); margin: 6px 6px 0; padding: 0; }
  .app .side:hover:not(.closing), .app .side:focus-within:not(.closing) { width: var(--side-open); box-shadow: 0 10px 40px rgba(0,0,0,.14); }
  .app .side:hover:not(.closing) .side-label, .app .side:focus-within:not(.closing) .side-label { opacity: 1; }
  .app .side:hover:not(.closing) .side-group, .app .side:focus-within:not(.closing) .side-group { opacity: 1; color: var(--text-muted); border-top: 0; height: 30px; padding: 14px 10px 4px; margin: 0; }
  .app .ov.six { grid-template-columns: repeat(4, 1fr); }
  .app .ov .s2 { grid-column: span 3; }
}

/* < 1100px: three across; wide cards take the full row; tables scroll inside their card */
@media (max-width: 1099px) {
  .app .ov.six, .app .ov.five, .app .tiles5, .app .tiles6, .app .grid4 { grid-template-columns: repeat(3, 1fr); }
  .app .ov.six .w2, .app .ov.five .w2 { grid-column: 1 / -1; }
  .app .ov .s2, .app .ov .s3, .app .ov .s4 { grid-column: span 6; }
  .app .ov .s5, .app .ov .s6, .app .ov .s7, .app .ov .s8, .app .ov .s9, .app .ov .s12 { grid-column: span 12; }
}

/* < 700px (phones): one card per row; sidebar becomes a drawer behind the menu button */
@media (max-width: 699px) {
  .app .content { margin-left: 0; }
  .app .side { width: 270px; transform: translateX(-100%); }
  .app .side.open { transform: none; box-shadow: 0 10px 40px rgba(0,0,0,.2); }
  .app .side .side-label { opacity: 1; }
  .app .side .side-group { opacity: 1; color: var(--text-muted); border-top: 0; height: 30px; padding: 14px 10px 4px; margin: 0; }
  .app.menu-open .side-backdrop { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.28); z-index: 25; }
  .app .menu-btn { display: inline-block; }
  .app .wrap.wide { padding: 0 14px 30px; }
  .app .page-head { flex-wrap: wrap; gap: 10px; }
  .app .page-head .filters { width: 100%; }
  .app .page-head select { flex: 1; min-width: 0; }
  .app .ov, .app .ov.six, .app .ov.five, .app .grid2, .app .grid3, .app .grid4, .app .tiles4, .app .tiles5, .app .tiles6, .app .chart-grid { grid-template-columns: 1fr; }
  .app .ov > *, .app .ov.six > *, .app .ov.five > * { grid-column: 1 / -1 !important; }
  .app .jump { flex-wrap: wrap; }
}

/* ---- shell v2 (2026-11-18): narrower sidebar, wrapping labels, logo, filters under the title ---- */
body.app { --side-open: 200px; }
.app .side-brand { padding: 16px 14px 10px; }
.app .side-logo { display: block; width: 64px; height: auto; transition: width .16s ease; }
.app .side-item { white-space: normal; align-items: flex-start; line-height: 1.25; font-size: 14px; padding: 8px 10px; }
.app .side-item .side-icon { margin-top: -1px; }
.app .side-label { min-width: 0; }
.app .page-head { align-items: flex-start; padding: 14px 0 12px; }
.app .page-titles .filters { display: flex; gap: 8px; margin-top: 10px; }
.app .page-head select { font-size: 13.5px; padding: 6px 10px; }
.app .data-time { text-align: right; font-size: 12.5px; color: var(--text-muted); line-height: 1.6; white-space: nowrap; padding-top: 4px; }
.app .data-time b { color: var(--text-heading); font-weight: 600; }
@media (max-width: 1399px) {
  .app .side-logo { width: 40px; }

  .app .side-brand { padding: 16px 12px 10px; }
  .app .side-item { white-space: nowrap; }
  .app .side:hover:not(.closing) .side-item, .app .side:focus-within:not(.closing) .side-item { white-space: normal; }

  .app .page-titles { flex: 1 1 60%; }

  .app .data-time { flex: 1 1 100%; text-align: left; display: flex; gap: 12px; padding-top: 0; order: 3; }

/* ---- Weekly Review: months collapse, weeks newest first ---- */
.app .side-sep { height: 1px; background: var(--hairline); margin: 12px 8px 8px; }
.app .wk-list { display: grid; gap: 10px; max-width: 760px; margin-top: 10px; }
.app .wk-month { background: #fff; border: 1px solid var(--hairline); border-radius: 14px; overflow: hidden; }
.app .wk-month summary { display: flex; align-items: center; gap: 10px; padding: 14px 18px; cursor: pointer; list-style: none; font-size: 16px; font-weight: 700; color: var(--text-heading); }
.app .wk-month summary::-webkit-details-marker { display: none; }
.app .wk-month summary::before { content: "▸"; color: var(--text-muted); font-size: 13px; transition: transform .12s ease; }
.app .wk-month[open] summary::before { transform: rotate(90deg); }
.app .wk-count { margin-left: auto; font-size: 13px; font-weight: 500; color: var(--text-muted); }
.app .wk-row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 18px; padding: 12px 18px; border-top: 1px solid var(--hairline); font-size: 14.5px; }
.app .wk-range { color: var(--text-heading); font-weight: 600; }
.app .wk-num { color: var(--text-muted); font-size: 13px; }
.app .wk-link { color: var(--red); font-weight: 600; text-decoration: none; }
.app .wk-link:hover { text-decoration: underline; }
.app dialog.soon { border: 0; border-radius: 16px; padding: 22px 24px; max-width: 360px; box-shadow: 0 20px 60px rgba(0,0,0,.2); font-family: inherit; }
.app dialog.soon::backdrop { background: rgba(0,0,0,.28); }
.app dialog.soon h3 { margin: 0 0 6px; font-size: 18px; color: var(--text-heading); }
.app dialog.soon p { margin: 0 0 16px; font-size: 14px; color: var(--text-body); line-height: 1.4; }
.app dialog.soon button { font: inherit; font-size: 14px; font-weight: 600; background: var(--red); color: #fff; border: 0; border-radius: 10px; padding: 8px 18px; cursor: pointer; }
@media (max-width: 699px) { .app .wk-row { grid-template-columns: 1fr auto; } .app .wk-num { display: none; } }
.app .page-titles .filters[hidden] { display: none; }

/* ---- sections (2026-11-18): quiet headings, pinned section tags, current tag outlined in red ---- */
.app .area-head { display: flex; align-items: baseline; margin: 28px 0 12px; scroll-margin-top: calc(var(--headH, 0px) + var(--jumpH, 0px) + 10px); }
.app .area-head h2 { font-size: 15px; font-weight: 700; color: var(--text-heading); letter-spacing: 0; margin: 0; }
.app .area-head .sec-note { display: none; }
.app .jump { top: var(--headH, 0px); z-index: 15; margin: 0; padding: 10px 0; }
.app .jump button { border: 1px solid transparent; }
.app .jump button.on { border-color: var(--red); color: var(--red); background: #fff; }
/* pinned tag bar ends in its own separator line, with breathing room above it; content scrolls under it */
.app .jump { padding: 10px 0 14px; border-bottom: 1px solid var(--hairline); margin-bottom: 4px; }
/* smaller logo (owner, 2026-11-18) */

.app .side-brand { padding: 14px 14px 8px; }

  .app .side-logo { width: 30px; }
  .app .side:hover:not(.closing) .side-logo, .app .side:focus-within:not(.closing) .side-logo { width: 38px; }
  .app .side-brand { padding: 14px 17px 8px; }
}
.app .jump { border-bottom-color: #DCD8D2; }

/* ---- scrollable tables (owner, 2026-11-18): header, first column and Total row stay pinned ---- */
.tscroll { overflow: auto; position: relative; max-width: 100%; }
.tscroll table.score { margin-top: 0; white-space: nowrap; }
.tscroll table.score th { position: sticky; top: 0; background: #fff; z-index: 2; box-shadow: inset 0 -1px 0 var(--hairline); }
.tscroll table.score td:first-child, .tscroll table.score th:first-child { position: sticky; left: 0; background: #fff; z-index: 1; box-shadow: inset -1px 0 0 var(--hairline); }
.tscroll table.score th:first-child { z-index: 3; }
.tscroll table.score tr.hl td:first-child { background: #FFF6F6; }
.tscroll table.score tr.tot td { position: sticky; bottom: 0; z-index: 2; background: #FAF9F7; box-shadow: 0 -6px 0 #fff, 0 -7px 0 var(--hairline); }
.tscroll table.score tr.tot td:first-child { z-index: 3; }
.ov .card .tscroll { margin-top: 4px; }
.ov.area.five { margin-bottom: 10px; }
.ov .funnel { display: grid; gap: 9px; margin-top: 8px; }
.ov .fn-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; }
.ov .fn-name { color: var(--text-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ov .fn-val { font-weight: 700; color: var(--text-heading); font-variant-numeric: tabular-nums; }
.ov .fn-track { height: 8px; margin-top: 3px; }
.ov .fn-bar { height: 8px; background: var(--red); border-radius: 0 4px 4px 0; }
.wide .ov .fn-head { font-size: 13.5px; }

/* ---- readable gaps between table columns (owner, 2026-11-18); values never wrap ---- */
.ov table.score th + th, .ov table.score td + td { padding-left: 18px; }
.wide .ov table.score th + th, .wide .ov table.score td + td { padding-left: 22px; }
.ov table.score td, .ov table.score th { white-space: nowrap; }
.ov .card:has(> table.score) { overflow-x: auto; }

/* ---- BDR grid (owner, 2026-11-18): 4 cards a row, then the 2 bookings charts, then 3 tables ---- */
.ov.bdr { grid-template-columns: repeat(12, 1fr); gap: 10px; }
.ov.bdr > .ctile { grid-column: span 3; }
.ov.bdr > .ctile.half { grid-column: span 6; }
.ov.bdr > .ctile.third { grid-column: span 4; }
.ov.bdr .ctile .legend { margin-top: 6px; }
@media (max-width: 1099px) {
  .app .ov.bdr > .ctile { grid-column: span 6; }
  .app .ov.bdr > .ctile.half, .app .ov.bdr > .ctile.third { grid-column: 1 / -1; }
}
