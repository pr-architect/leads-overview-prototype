:root {
  /* Bounce design-system tokens */
  --red: #D42B30;
  --green: #178040;
  --green-surface: #D6F0DE;
  --text-heading: #424242;
  --text-body: #5E5E5E;
  --text-muted: #8A8A8A;
  --page: #FFFFFF;
  --card: #FFFFFF;
  --hairline: #EDEBE8;
  --grid: #EDEBE8;
  --spark: #C9C6C1;
  /* chart series: validated together (all pairs pass, light mode) */
  --s-deploy: #D42B30;
  --s-submit: #2a78d6;
  --s-new: #eda100;
  --s-existing: #1baf7a;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); }
body {
  font-family: "Hanken Grotesk", system-ui, sans-serif;
  color: var(--text-body);
  line-height: 1.2;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 32px 28px 56px; }

/* header */
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
.brand { display: flex; align-items: center; gap: 14px; }
.logo { width: 44px; height: 44px; border-radius: 13px; background: var(--red); display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 24px; letter-spacing: -1px; }
h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-heading); }
.sub { margin-top: 4px; font-size: 15px; color: var(--text-muted); min-height: 18px; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; background: #F6F5F3; font-size: 14px; font-weight: 600; color: var(--text-heading); }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
.pill.live .dot { background: var(--green); }

/* hero band */
.hero {
  border-radius: 22px; padding: 26px 28px; margin-bottom: 18px;
  background: linear-gradient(135deg, #FFF4F4 0%, #FFE6E6 100%);
  border: 1px solid #F6CFD0;
  display: grid; grid-template-columns: 1.15fr 1fr 1fr 1fr; min-height: 200px;
}
.hero .cell { padding: 0 22px; border-left: 1px solid #F3D3D4; }
.hero .cell:first-child { padding-left: 0; border-left: 0; }
.label { font-size: 15px; font-weight: 600; color: var(--text-heading); }
.label small { display: block; margin-top: 2px; font-weight: 500; color: var(--text-muted); font-size: 13px; }
.hero-value { font-size: 56px; font-weight: 800; letter-spacing: -2px; color: var(--text-heading); margin: 10px 0 8px; }
.value { font-size: 36px; font-weight: 800; letter-spacing: -1px; color: var(--text-heading); margin: 10px 0 8px; }
.delta { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
.delta.good { color: var(--green); background: var(--green-surface); }
.delta.bad  { color: var(--red); background: #FFE0E1; }

.delta svg { width: 10px; height: 10px; }
.vs { font-size: 13px; color: var(--text-muted); margin-left: 6px; }
.note { font-size: 13px; color: var(--text-muted); margin-top: 12px; }
.spark { display: block; margin-top: 14px; width: 100%; height: 34px; }

/* sections */
section { margin-top: 34px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.4px; color: var(--red); }
.sec-note { font-size: 14px; color: var(--text-muted); }
.card { background: var(--card); border: 1px solid var(--hairline); border-radius: 22px; padding: 22px; }

/* colour-blocked sibling tiles */
.tiles4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.tile { border-radius: 16px; padding: 20px 22px; border: 1px solid; min-height: 150px; }
.tile .name { font-size: 16px; font-weight: 700; color: var(--text-heading); }
.tile .value { font-size: 40px; }
.tint-red   { background: linear-gradient(160deg, #FFF6F6, #FFE9EA); border-color: #F6CFD0; }
.tint-gold  { background: linear-gradient(160deg, #FFFBF0, #FFF1D2); border-color: #F2DFAF; }
.tint-green { background: linear-gradient(160deg, #F4FBF6, #DFF3E6); border-color: #BFE3CB; }
.tint-blue  { background: linear-gradient(160deg, #F5F8FE, #E3ECFB); border-color: #C7D7F2; }

/* charts */
.chart-grid { display: grid; grid-template-columns: 300px 1fr; gap: 14px; }
.mini { display: grid; gap: 14px; }
.mini .card { padding: 20px 22px; }
.legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; color: var(--text-body); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.key-line { display: inline-block; width: 16px; height: 2px; border-radius: 2px; }
.key-rect { display: inline-block; width: 11px; height: 11px; border-radius: 3px; }
.bg-deploy { background: var(--s-deploy); }

.chart { position: relative; min-height: 262px; }

.tip {

  border-radius: 12px; padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.08);
  font-size: 13px; min-width: 150px; opacity: 0; transition: opacity .08s; z-index: 5;
}

details { margin-top: 12px; }

table { border-collapse: collapse; margin-top: 10px; font-size: 13px; font-variant-numeric: tabular-nums; width: 100%; }
